# =============================================================================
# Plan00 Final Replay: balanced Standard four-terrain replay after specialists.
# plan00 最终回放：专项结束后的 Standard 四地形均衡回放。
# =============================================================================

[env]
num_envs = 2048
episode_length_s = 25
num_goal_obs = 0

[env_conf]
seed = 0

[terrain]
mode = "standard"
num_rows = 10
num_cols = 20
difficulty_range = [0.0, 0.85]
curriculum = true
max_init_terrain_level = 2

[terrain.standard.pyramid_slope]
proportion = 0.25

[terrain.standard.pyramid_slope_inv]
proportion = 0.25

[terrain.standard.pyramid_stairs]
proportion = 0.25

[terrain.standard.pyramid_stairs_inv]
proportion = 0.25

[terrain.standard.maze]
proportion = 0.00

[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.3, 1.5]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.5

[noise]
add_noise = true

[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
resampling_time = [6.0, 10.0]

[commands.limit]
lin_vel_x = [0.0, 1.2]
lin_vel_y = [-0.10, 0.10]
ang_vel_z = [-0.20, 0.20]

[commands.ranges]
lin_vel_x = [0.0, 0.6]
lin_vel_y = [-0.05, 0.05]
ang_vel_yaw = [-0.10, 0.10]

[rewards.track_lin_vel_xy]
weight = 1.90
[rewards.track_lin_vel_xy.params]
std = 0.35
command_name = "base_velocity"

[rewards.track_ang_vel_z]
weight = 0.30
[rewards.track_ang_vel_z.params]
std = 0.35
command_name = "base_velocity"

[rewards.forward_velocity]
weight = 0.18

[rewards.lin_vel_z]
weight = -0.5

[rewards.ang_vel_xy]
weight = -0.34

[rewards.joint_acc]
weight = -7.5e-7

[rewards.joint_torques]
weight = -1e-4

[rewards.dof_pos_limits]
weight = -0.3

[rewards.action_rate]
weight = -0.025

[rewards.undesired_contacts]
weight = -0.3
[rewards.undesired_contacts.params]
threshold = 1

[rewards.flat_orientation]
weight = -1.50

[rewards.energy]
weight = -2.5e-5

[rewards.correct_base_height]
weight = -0.55
[rewards.correct_base_height.params]
target_height = 0.38
use_height_scan = true
body_y_start = 5
body_y_end = 11
near_x_end = 4

[rewards.joint_position_penalty]
weight = -0.3
[rewards.joint_position_penalty.params]
stand_still_scale = 2.0
cmd_threshold = 0.10
ang_cmd_threshold = 0.20

[rewards.stand_still_motion]
weight = -0.8
[rewards.stand_still_motion.params]
command_name = "base_velocity"
lin_cmd_threshold = 0.15
ang_cmd_threshold = 0.20
vertical_vel_scale = 0.5
ang_vel_scale = 0.5
joint_vel_scale = 0.1

[rewards.feet_air_time]
weight = 1.0
[rewards.feet_air_time.params]
command_name = "base_velocity"
threshold = 0.18

[rewards.feet_slide]
weight = -0.1

[rewards.feet_regulation]
weight = -0.05
[rewards.feet_regulation.params]
height_scale = 0.01
use_height_scan = true
body_y_start = 5
body_y_end = 11
near_x_end = 4

[rewards.feet_stumble]
weight = -0.06

[rewards.feet_clearance]
weight = 0.22
[rewards.feet_clearance.params]
command_name = "base_velocity"
target_height = 0.08
std = 0.05
terrain_height_scale = 0.65
max_terrain_extra_height = 0.08
speed_height_scale = 0.01
body_y_start = 5
body_y_end = 11
near_x_start = 2
near_x_end = 10
delta_quantile = 0.85

[rewards.termination]
weight = -4.5

[rewards.action_smoothness]
weight = -0.012

[rewards.dof_vel]
weight = -4.5e-4

[rewards.base_lateral_vel]
weight = -0.45

[rewards.air_time_variance_penalty]
weight = -0.8

[rewards.pivot_turning]
weight = -0.2
[rewards.pivot_turning.params]
lin_vel_threshold = 0.2
ang_vel_threshold = 0.5

[velocity_curriculum]
promote_threshold = 0.55
promote_count = 3
min_checks_per_stage = 40
demote_threshold = 0.32
demote_count = 2

[[velocity_curriculum.stages]]
lin_vel_x = [0.0, 0.6]
lin_vel_y = [-0.05, 0.05]
ang_vel_yaw = [-0.10, 0.10]

[[velocity_curriculum.stages]]
lin_vel_x = [0.0, 0.9]
lin_vel_y = [-0.08, 0.08]
ang_vel_yaw = [-0.15, 0.15]

[[velocity_curriculum.stages]]
lin_vel_x = [0.0, 1.1]
lin_vel_y = [-0.10, 0.10]
ang_vel_yaw = [-0.20, 0.20]
