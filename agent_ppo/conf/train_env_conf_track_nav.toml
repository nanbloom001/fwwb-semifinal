# =============================================================================
# Track Nav: compact-goal-observation navigation training.
# Track Nav：小幅 goal 观测扩展的赛道导航训练。
# =============================================================================

[env]
num_envs = 2048
episode_length_s = 35
num_goal_obs = 4

[env_conf]
seed = 0

[terrain]
mode = "track"
num_rows = 10
num_cols = 10
difficulty_range = [0.0, 0.8]
curriculum = true
max_init_terrain_level = 1

[terrain.track]
track_length = 5
sub_terrains = ["pyramid_slope", "pyramid_slope_inv", "pyramid_stairs", "pyramid_stairs_inv", "open_entry_maze"]
num_parallel_tracks = 8

[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.4, 1.4]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.0

[noise]
add_noise = true

[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
resampling_time = [6.0, 8.0]

[commands.limit]
lin_vel_x = [0.0, 1.0]
lin_vel_y = [-0.5, 0.5]
ang_vel_z = [-1.5, 1.5]

[commands.ranges]
lin_vel_x = [0.0, 0.45]
lin_vel_y = [-0.15, 0.15]
ang_vel_yaw = [-0.8, 0.8]

[rewards.track_lin_vel_xy]
weight = 0.8
[rewards.track_lin_vel_xy.params]
std = 0.25
command_name = "base_velocity"

[rewards.track_ang_vel_z]
weight = 0.5
[rewards.track_ang_vel_z.params]
std = 0.25
command_name = "base_velocity"

[rewards.reach_goal]
weight = 10.0
[rewards.reach_goal.params]
threshold = 0.6

[rewards.goal_progress]
weight = 1.5

[rewards.heading_to_goal]
weight = 0.4

[rewards.navigation_time]
weight = -0.02

[rewards.navigation_termination]
weight = -3.0

[rewards.lin_vel_z]
weight = -0.8

[rewards.ang_vel_xy]
weight = -0.20

[rewards.joint_acc]
weight = -5e-7

[rewards.joint_torques]
weight = -1e-4

[rewards.dof_pos_limits]
weight = -0.5

[rewards.action_rate]
weight = -0.01

[rewards.undesired_contacts]
weight = -0.5
[rewards.undesired_contacts.params]
threshold = 1

[rewards.flat_orientation]
weight = -1.2

[rewards.energy]
weight = -2e-5

[rewards.correct_base_height]
weight = -0.45
[rewards.correct_base_height.params]
target_height = 0.38

[rewards.stand_still_motion]
weight = -0.6
[rewards.stand_still_motion.params]
command_name = "base_velocity"
lin_cmd_threshold = 0.15
ang_cmd_threshold = 0.20
vertical_vel_scale = 0.5
ang_vel_scale = 0.5
joint_vel_scale = 0.1

[rewards.feet_air_time]
weight = 0.8
[rewards.feet_air_time.params]
command_name = "base_velocity"
threshold = 0.18

[rewards.feet_slide]
weight = -0.1

[rewards.feet_stumble]
weight = -0.06

[rewards.termination]
weight = -3.0

[rewards.action_smoothness]
weight = -0.01

[rewards.dof_vel]
weight = -3.5e-4

[rewards.base_lateral_vel]
weight = -0.5

[rewards.air_time_variance_penalty]
weight = -0.6

[rewards.pivot_turning]
weight = -0.15
[rewards.pivot_turning.params]
lin_vel_threshold = 0.2
ang_vel_threshold = 0.5

[rewards.feet_clearance]
weight = 0.12
[rewards.feet_clearance.params]
command_name = "base_velocity"
target_height = 0.07
std = 0.05
terrain_height_scale = 0.50
max_terrain_extra_height = 0.06
speed_height_scale = 0.01
body_y_start = 5
body_y_end = 11
near_x_start = 2
near_x_end = 10
delta_quantile = 0.85
