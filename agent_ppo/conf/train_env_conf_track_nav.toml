# Eval adapter for wide platform command ranges such as:
# lin_vel_x=[0.0,1.7], lin_vel_y=[-1,1], ang_vel_z=[-1.8,1.8].
# The maze policy should not chase those random commands; it uses goal + scan
# for navigation and sees this stable forward command as a gait anchor.
eval_command_override = true
eval_command = [0.85, 0.0, 0.0]

# -----------------------------------------------------------------------------
# Locomotion preservation: keep enough of the old walking objective so the
# pretrained model does not forget stable gait while learning navigation.
# -----------------------------------------------------------------------------
[rewards.track_lin_vel_xy]
weight = 2.35
[rewards.track_lin_vel_xy.params]
std = 0.32
command_name = "base_velocity"

[rewards.command_speed_advantage]
weight = 0.50
[rewards.command_speed_advantage.params]
command_name = "base_velocity"
deadband = 0.02
surplus_scale = 0.32
lag_scale = 0.30
max_surplus = 0.24
max_lag = 0.60
lag_penalty_scale = 0.95
min_command = 0.10

[rewards.track_ang_vel_z]
weight = 0.12
[rewards.track_ang_vel_z.params]
std = 0.35
command_name = "base_velocity"

