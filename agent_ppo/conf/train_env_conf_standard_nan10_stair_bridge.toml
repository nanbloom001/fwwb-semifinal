# =============================================================================
# Standard nan10 Stair Bridge
# Standard nan10 楼梯桥接训练
#
# Goal: continue from nan10-8750 without inheriting the HJC diagonal stair
# route dependency. Keep command tracking as the main objective and avoid
# terrain-label gated stair shaping rewards.  Height-scan stair terms are used
# only after monitor validation and kept bounded.
# 目标：从 nan10-8750 继续训练，不继承 HJC 沿边界/对角线爬楼梯的路径依赖。
# 主奖励仍是速度指令跟踪；放弃未能验证的 terrain label 门控，保留已验证的高度计塑形。
#
# → Next-phase 升级条件：
#   - step_score 在 stairs/stairs_inv 上稳定为正
#   - forward_score 持续提升且无明显台阶前犹豫/绊倒
#   - 步态视觉上规整（无明显跛行/螃蟹步/抖动）
# =============================================================================

# === Basic Configuration ===
# === 基础配置 ===
[env]
# Number of parallel environments, valid range: [1, 4096].
# 并行环境数量，合法范围：[1, 4096]
num_envs = 4096

# Max episode duration (seconds).
# 最大 episode 时长（秒）
episode_length_s = 30

[env_conf]
# Random seed.
# 随机种子
seed = 0


# === Terrain Configuration ===
# === 地形配置 ===
[terrain]
# Terrain mode, valid values: "standard" | "track".
# 地形模式，合法值："standard" | "track"
mode = "standard"

# In standard mode, num_rows = number of difficulty tiers (curriculum levels along X),
# valid range [1, 10], recommended 10.
# standard 模式下 num_rows 表示**难度级别数**（沿 X 轴的课程档位），合法范围：[1, 10]，推荐 10
# Use full 10 curriculum tiers again across the standard terrain difficulty band.
# 恢复 10 个课程档位，并覆盖 standard 模式完整难度带。
num_rows = 10

# In standard mode, num_cols = parallel plots within the same difficulty tier along Y,
# valid range [1, 40], recommended 20.
# Note: in standard mode num_cols is NOT a difficulty tier, just parallel plots for env distribution.
# standard 模式下 num_cols 表示**同一难度下的并行地块数**（沿 Y 轴），合法范围：[1, 40]，推荐 20
# 注意：standard 模式下 num_cols 不是难度档，而是用于分散大量 env 到不同地块的并行数
num_cols = 20

# Difficulty range [min, max], valid range: [0.0, 1.0].
# 难度范围 [min, max]，合法范围：[0.0, 1.0]
# Full standard difficulty is enabled from startup for this continuation round.
difficulty_range = [0.0, 1.0]

# Whether to enable terrain curriculum (promote/demote difficulty by performance).
# 是否启用地形课程学习（按表现晋级/降级难度）
# Curriculum stays enabled inside the currently scheduled difficulty band.
# terrain.curriculum also controls the built-in velocity range expansion; the
# Python-side VelocityCurriculum independently manages command sampling ranges,
# so enabling terrain.curriculum here only affects terrain difficulty, not commands.
# (Built-in velocity expansion is bounded by commands.limit, already correct.)
# 地形课程保持开启，但难度带由 fine_tune_schedule.terrain_phases 分段提高；
# 速度范围独立由 Python 侧 VelocityCurriculum 管理（见 [velocity_curriculum] 节）
curriculum = true

# Max init difficulty tier for robot placement, valid range: [0, 9].
# 机器人初始放置的最大难度档，合法范围：[0, 9]
# Start across all terrain tiers.
max_init_terrain_level = 9


# Sub-terrain proportions (all proportions must sum to 1.0).
# Allowed sub-terrains: pyramid_slope | pyramid_slope_inv | pyramid_stairs | pyramid_stairs_inv | maze
# NOTE: There is NO "flat" terrain type. To simulate flat ground, use pyramid_slope/inv at difficulty=0.
# 子地形比例（所有 proportion 之和必须 = 1.0）
# 合法子地形：pyramid_slope | pyramid_slope_inv | pyramid_stairs | pyramid_stairs_inv | maze
# 注意：不存在"平地"地形类型。平地效果 = pyramid_slope + max_init_terrain_level=0（难度0时坡度≈0）
#
# Nan10 stair bridge training: keep enough slope/inverse-slope samples to
# preserve the original gait, while making stairs/inverse-stairs the main
# acquisition target.
[terrain.standard.pyramid_slope]
proportion = 0.075

[terrain.standard.pyramid_slope_inv]
proportion = 0.075

[terrain.standard.pyramid_stairs]
proportion = 0.40

[terrain.standard.pyramid_stairs_inv]
proportion = 0.45

[terrain.standard.maze]
proportion = 0.0


# === Domain Randomization ===
# === 域随机化 ===
[domain_rand]
# Master switch for domain randomization.
# 域随机化总开关
enable_domain_rand = true

# Whether to randomize ground friction.
# 是否随机化地面摩擦系数
randomize_friction = true

# Friction range [min, max], must be >= 0.
# 摩擦系数采样范围 [min, max]，必须 >= 0
friction_range = [0.3, 1.5]

# Whether to periodically push the robot.
# 是否周期性对机器人施加外部推力
# Disabled for phase-1: remove disturbance while robot learns basic gait.
# Enable after step_score > 10.
# 阶段1关闭：先学会走路再加干扰。step_score > 10 后可开启。
push_robots = false

# Push interval (seconds), must be > 0.
# 推力间隔（秒），必须 > 0
push_interval_s = 15

# Max push velocity in XY plane (m/s), must be >= 0.
# XY 平面最大推力速度 (m/s)，必须 >= 0
max_push_vel_xy = 0.5


# === Observation Noise ===
# === 观测噪声 ===
[noise]
# Whether to add noise to observations.
# 是否在观测中加入噪声
add_noise = true


# === Initial State ===
# === 初始状态 ===
[init_state]
# Robot initial position [x, y, z] (m); z valid range [0.30, 0.60]m, recommended 0.35m.
# 机器人初始位置 [x, y, z] (m)；z 合法范围：[0.30, 0.60]m，推荐 0.35m
pos = [0.0, 0.0, 0.35]


# === Velocity Commands ===
# === 速度命令 ===
[commands]
# Velocity command resampling interval [min, max] (seconds).
# 速度命令重采样区间 [min, max]（秒）
resampling_time = [10.0, 15.0]

[commands.limit]
# Velocity command **hard limits** (curriculum may expand sampling range up to here).
# 速度命令 **采样上限**（硬约束，curriculum 最多扩展到该范围）
lin_vel_x = [0.0, 0.8]
lin_vel_y = [-0.35, 0.35]
ang_vel_z = [-0.40, 0.40]

[commands.ranges]
# Velocity command **initial sampling ranges** (expand towards limit when curriculum is enabled).
# 速度命令 **初始采样范围**（curriculum 开启时会动态扩大到 limit）

# Freeze this continuation round at the target command envelope instead of
# increasing speed stage-by-stage. Keep zero-speed samples for stand-still
# recovery, but cap forward velocity at 0.8 m/s and only slightly widen
# lateral/yaw commands.
lin_vel_x = [0.0, 0.8]
lin_vel_y = [-0.35, 0.35]
ang_vel_yaw = [-0.40, 0.40]

[command_mix]
# PPO-side command masking.  The Isaac command generator still samples the full
# range, but policy observations and custom rewards see this mixed command.
# This keeps most environments moving along sampled translation directions
# without rewarding a pre-stair yaw turn.
enabled = true
spin_only_ratio = 0.00
vx_only_ratio = 0.60
vx_vy_only_ratio = 0.00
full_ratio = 0.40
log_interval = 200


# =====================================================================
# Reward Configuration
# 奖励配置
#
# Each reward term must have a numeric `weight`; parameterized rewards use [rewards.<name>.params].
# 每个奖励项必须包含数值型 weight；带参数的奖励用 [rewards.<name>.params] 配置
#
# Deliberately not activated in this bridge stage:
#   inv_stair_climb_action: worker-side invocation / terrain-label gate was not verifiable.
#   stair_ray_alignment, stair_heading_alignment: can bias the policy toward a fixed stair/world axis.
#   stair_desired_* and yaw_drift: keep this first nan10 bridge free of stair-direction shaping.
#   forward_velocity, forward_stall: avoid a body/world forward shortcut; command tracking is the source of truth.
#   stair_height_transition: scan gate did not produce usable monitor signal in the previous run.
#   feet_swing_forward: keep out for now; dense feet_clearance handles the first stair-acquisition step.
#   commanded_still_penalty: previous monitor capture stayed at zero; pivot_turning + command tracking are kept instead.
# Real stair-shaping step:
#   feet_clearance is the dense primary lift signal.
#   height_scan_feet_clearance and stair_forward_foot_placement are weaker
#   scan-gated auxiliaries.
# =====================================================================

# --- Positive: velocity tracking ---
# --- 正向：速度跟踪 ---
[rewards.track_lin_vel_xy]
# Slightly reduced 3.0→2.5: still dominates penalty terms, but avoids over-weighting
# pure speed at the expense of gait quality on flat terrain.
# 小幅降低 3.0→2.5：仍主导惩罚项之和，但避免在平地上过分偏向速度而忽视步态质量
weight = 2.40
[rewards.track_lin_vel_xy.params]
# Std of Gaussian kernel, controls how sharp the error → reward decay is.
# 高斯核标准差，控制误差 → 奖励的衰减陡峭程度
std = 0.25
# Velocity command name.
# 速度命令名
command_name = "base_velocity"

[rewards.command_direction_progress]
# Reward actual body-frame XY velocity projected onto the mixed command
# direction.  This adds explicit "move along the command" pressure so stair
# hesitation/timeouts cannot score well by merely avoiding falls.
weight = 0.70
[rewards.command_direction_progress.params]
command_name = "base_velocity"
min_command_speed = 0.10
target_speed_ratio = 0.80
min_target_speed = 0.08

[rewards.command_direction_deviation]
# Penalize large velocity-direction errors relative to the mixed command.
# Quadratic direction error penalty.  Small errors get a tiny gradient; large
# sideways/diagonal motion is penalized strongly.
weight = -0.52
[rewards.command_direction_deviation.params]
command_name = "base_velocity"
min_command_speed = 0.10
min_actual_speed = 0.10
angle_limit_deg = 0.0
max_angle_deg = 50.0
log_interval = 100

[rewards.command_path_progress]
# Reward per-step world-frame progress along the command path.  vx-only uses
# the reset/command-segment anchor direction; full commands use the current
# command direction so commanded turns are not punished.
weight = 0.40
[rewards.command_path_progress.params]
command_name = "base_velocity"
min_command_speed = 0.10
yaw_cmd_threshold = 0.08
target_step_progress = 0.006
segment_progress_cap = 0.80
log_interval = 100

[rewards.commanded_stall_penalty]
# Penalize sustained lack of progress along the sampled XY command.  This is
# not a dense forward reward; it starts only after a short stall duration and is
# suppressed during down-step probing/touchdown grace.
weight = -0.10
[rewards.commanded_stall_penalty.params]
command_name = "base_velocity"
min_command_speed = 0.15
min_projected_speed = 0.10
progress_ratio = 0.25
stall_time_s = 0.80
step_dt = 0.02
grace_after_contact_s = 0.20
min_contact_air_time = 0.04
body_y_start = 5
body_y_end = 11
near_x_start = 0
near_x_end = 4
front_x_start = 4
front_x_end = 10
up_min_height = 0.025
up_max_height = 0.20
wall_min_height = 0.24
min_step_score = 0.02
max_wall_score = 0.08
log_interval = 100

[rewards.track_ang_vel_z]
weight = 1.33
[rewards.track_ang_vel_z.params]
std = 0.25
command_name = "base_velocity"

# --- Negative: base stability ---
# --- 负向：基座稳定 ---
[rewards.lin_vel_z]
# Penalty on vertical linear velocity.
# Z 方向线速度惩罚（抑制上下跳跃）
# Phase-0 reduction: flat terrain = minimal vertical oscillation; free up gradient budget.
# Phase-0 减小：平地训练上下跳跃少，释放梯度预算给姿态项
weight = -0.45

[rewards.ang_vel_xy]
# Penalty on pitch/roll angular velocity.
# X/Y 方向角速度惩罚（抑制 pitch/roll 抖动）
# For stairs, some pitch/roll is necessary during step-up. Keep the penalty,
# but loosen it from flat-ground shaping strength to avoid over-constraining body motion.
# 楼梯上行需要一定 pitch/roll 调整，因此保留该惩罚但适度放松，
# 避免像平地塑形那样过度限制机身姿态变化。
weight = -0.32

# --- Negative: joint smoothness ---
# --- 负向：关节 ---
[rewards.joint_acc]
# Joint acceleration penalty.
# 关节加速度惩罚
# Phase-0: use reference end value -7.5e-7 (flat terrain = simpler dynamics, can afford tighter)
# Phase-0：平地动力学简单，直接使用参考终值
weight = -7.5e-7

[rewards.joint_torques]
# Joint torque penalty.
# 关节扭矩惩罚
weight = -1e-4

[rewards.dof_pos_limits]
# Penalty when joints approach position limits.
# 接近关节位置极限时的惩罚
# Phase-0 reduction: flat terrain = much fewer limit violations; lower weight.
# Phase-0 减小：平地训练傧位限触发频率大幅降低
weight = -0.3

# --- Negative: action smoothness ---
# --- 负向：动作平滑 ---
[rewards.action_rate]
# Delta between consecutive actions (1st order).
# 相邻动作差（一阶）
# Stairs require more decisive swing-leg action than flat walking.
# Keep smoothing, but reduce the 1st-order action penalty slightly.
# 台阶环境比平地更需要明确的摆腿动作，因此略微减小一阶动作变化惩罚。
weight = -0.017

# --- Negative: undesired contacts ---
# --- 负向：碰撞 ---
[rewards.undesired_contacts]
# Phase-0 reduction: flat terrain = fewer unexpected body contacts.
# Phase-0 减小：平地不易发生意外身体接触
weight = -0.3
[rewards.undesired_contacts.params]
# Max allowed contacts before penalty kicks in.
# 触发阈值：被罚前允许的最大接触数
threshold = 1

# --- Extra: anti-tipping ---
# --- 额外：防倾倒 ---
[rewards.flat_orientation]
# Penalty on deviation from flat base orientation.
# 基座偏离水平姿态的惩罚
# Flat-ground shaping used a very strong upright-body prior. For stairs this becomes
# counter-productive because the robot must pitch its body while climbing.
# 平地阶段使用了很强的“机身必须水平”先验；切到楼梯后这会妨碍上台阶，
# 因为机器人需要在上行时适当俯仰机身。
weight = -1.25

[rewards.reach_goal]
# Reach-goal reward example (active only when env.goal_positions is maintained, i.e. track terrain).
# 到达目标奖励示例（仅在 track 地形下 env.goal_positions 被维护时生效）。
weight = 10.0
[rewards.reach_goal.params]
threshold = 0.6

# TODO: you can add non-IsaacLab locomotion rewards such as energy /
# correct_base_height / feet_stumble as needed.
# After implementing the corresponding _reward_<name> method in
# agent_ppo/feature/reward_process.py, you can activate it here.
# TODO：可按需补充 energy / correct_base_height / feet_stumble 等非 IsaacLab 运控奖励。
# 自行在 agent_ppo/feature/reward_process.py 实现对应 _reward_<name> 方法后即可在此激活。

# ── 基类内置，直接激活 ─────────────────────────────────────────────
[rewards.action_smoothness]
# 2nd-order action smoothness penalty.
# 动作二阶平滑惩罚
# Keep a mild 2nd-order smoothness term, but avoid suppressing stair step-up swing.
# 保留温和的二阶平滑约束，但不能压制上台阶时的摆腿动作。
weight = -0.0084

[rewards.energy]
# Energy penalty: torque × joint velocity.
# 能耗惩罚（扭矩 × 角速度），对应赛题 energy 评分项
weight = -2e-5

[rewards.correct_base_height]
# Penalize deviation of base height from target.
# 惩罚机身高度偏离目标，对应赛题 posture 评分项
# On stairs the base height must vary while stepping up/down, so the flat-ground
# penalty is too strict and discourages climbing.
# 楼梯上/下时机身高度本来就会变化，平地阶段的高度惩罚过强，会压制上阶动作。
weight = -0.57
[rewards.correct_base_height.params]
# Go2 nominal standing height (m).
# Go2 标准站立高度 (m)
target_height = 0.38
use_height_scan = true

# [rewards.hip_to_default] REMOVED — covered by joint_position_penalty.
# hip joints are indices [0,3,6,9] in the 12-DOF joint vector and are already
# included in joint_position_penalty's full L2 norm over all 12 joints.
# Keeping both would double-penalize hip joints while under-constraining knee/ankle,
# skewing the gradient toward hip-only posture at the cost of full-chain naturalness.
# If per-joint weighting is needed in future, implement a weighted L2 in reward_process.py.
# [rewards.hip_to_default] 已移除 — 已被 joint_position_penalty 覆盖。
# 髋关节 (索引 0,3,6,9) 已包含在 joint_position_penalty 的全局 L2 范数中。
# 同时保留两者会对髋关节双重惩罚，导致梯度偏向髋关节、膝/踝关节欠约束。

# ── 自定义（reward_process.py 已实现）──────────────────────────────
[rewards.joint_position_penalty]
# Keep joint-angle regularization, but reduce it for stairs because knees/hips need
# larger deviation from nominal pose during ascent.
# 关节角正则仍然保留，但楼梯上行时膝/髋需要比平地更大的偏离幅度，因此适当降权。
weight = -0.24
[rewards.joint_position_penalty.params]
stand_still_scale = 2.0
cmd_threshold = 0.10
ang_cmd_threshold = 0.20

[rewards.stand_still_motion]
# Penalize body bobbing, pitch/roll摇摆, and repeated leg lifting when the
# command is near zero. This specifically targets the "原地上下晃动 + 小腿抬放"
# failure mode that global gait rewards cannot reliably suppress.
# 近零命令下惩罚机身上下晃动、pitch/roll 摇摆和小腿反复抬放，
# 专门针对当前出现的原地抖动问题。
weight = -0.8
[rewards.stand_still_motion.params]
command_name = "base_velocity"
lin_cmd_threshold = 0.15
ang_cmd_threshold = 0.20
vertical_vel_scale = 0.5
ang_vel_scale = 0.5
joint_vel_scale = 0.1

[rewards.feet_air_time]
# Adjusted: weight 1.0→0.5, threshold 0.25→0.18.
# Problem: at slow speeds (0–0.5 m/s) natural air time is <0.25s, so the
# reward was consistently NEGATIVE (≈0.25/step), acting as a net penalty.
# This also created an exploit: one leg stays airborne indefinitely to avoid
# the "air_time < threshold on landing" penalty — causing the RR leg circling.
# Lower threshold so slow-speed steps earn positive reward.
# Lower weight to reduce exploit incentive; air_time_variance_penalty handles symmetry.
# 修复：0.25s门槛对慢速过高，导致奖励持续为负。
# 同时封山了「腿永远悬空不落地」的exploit（右后腿画圈问题根因）。
# Stair ascent needs longer swing and more decisive foot lift than flat walking.
# Increase the positive signal slightly so policy is less afraid to lift the leg.
# 上台阶需要更长的摆腿和更明确的抬脚，因此略微增强正向滞空奖励。
weight = 0.45
[rewards.feet_air_time.params]
command_name = "base_velocity"
threshold = 0.16

[rewards.feet_slide]
# Penalize foot sliding (velocity when foot is in contact).
# 惩罚脚部打滑（接触地面时有速度）
weight = -0.1

[rewards.feet_stumble]
# Penalize feet hitting stair edges / walls (horizontal force >> vertical).
# 惩罚脚碰台阶边缘或墙壁（水平力 >> 垂直力）
# Keep this penalty, but lower it slightly during stair adaptation so exploratory
# toe contact with the step edge is not over-punished before the policy learns lift.
# 楼梯适应阶段略微降权，避免策略在尚未学会抬脚前就因为探索性碰边被过度惩罚。
weight = -0.05

[rewards.termination]
# Phase-0 increase: -1.0→-3.0. On flat terrain the robot SHOULD NOT fall.
# Falls are rare now, so each one is a genuine failure; penalize strongly.
# 平地上會摔倒是真正的失败，加重惩罚
weight = -3.0

# ── Round-4 新增：步态质量约束 ────────────────────────────────────────
# Round-4 addition: gait quality constraints

[rewards.dof_vel]
# NEW Round-4: Penalize large joint velocities (sum of squared joint velocities).
# 新增：惩罚关节速度过大（关节速度平方和），抑制"鬼畜"步态。
# 关节速度不受约束是步态节律紊乱的根本原因；保守初值，可视情提升。
# Stairs require faster leg swing than flat walking, so loosen this penalty.
# 楼梯比平地需要更快的摆腿，因此放松该惩罚。
weight = -4e-4

[rewards.base_lateral_vel]
# NEW Round-4: Penalize *untracked* lateral velocity error (actual_vy - cmd_vy)².
# 新增：惩罚侧向速度误差（实际侧向速度 - 指令侧向速度）²，防止无指令侧漂/螃蟹步。
# 注：不是惩罚侧向速度本身，而是误差，以免与 lin_vel_y 指令冲突。
weight = -0.5

[rewards.air_time_variance_penalty]
# Increased -0.3→-0.8: primary fix for RR-leg circling (asymmetric air time).
# With feet_air_time weight reduced, variance penalty must be the main enforcer
# of 4-leg symmetry. -0.8 is strong enough to prevent any single leg staying
# airborne while others contact — directly blocks the circling exploit.
# 加强 -0.3→-0.8：直接修复右后腿画圈问题。
# feet_air_time已降权，需要方差惩罚成为四踢对称的主要执行者。
# -0.8足以阻断「单腿不落地」的exploit。
weight = -0.78

[rewards.pivot_turning]
# NEW Round-4: Penalize pivoting on spot (low linear vel + high yaw vel with feet on ground).
# 新增：惩罚原地蹭脚旋转（低线速+高偏航角速度且多脚接触地面）。
# 鼓励通过迈步（lift & place）完成转弯；初值保守，防止与 track_ang_vel_z 正向奖励冲突。
weight = -0.22
[rewards.pivot_turning.params]
lin_vel_threshold = 0.2
ang_vel_threshold = 0.5

[rewards.uncommanded_yaw_rate]
# Penalize yawing while the command asks for translation but no yaw.
# This is command-direction based, not world-axis/stair-axis based.
# Fixed non-zero weight: platform logs showed that relying on a 0 -> non-zero
# fine-tune schedule may leave the reward term inactive in the running env.
weight = -0.095
[rewards.uncommanded_yaw_rate.params]
command_name = "base_velocity"
yaw_cmd_threshold = 0.08
min_command_speed = 0.10
base_scale = 0.60
stair_scale = 1.80
log_interval = 100

[rewards.uncommanded_heading_drift]
# Penalize heading drift within the current velocity-command segment when the
# command asks for translation but no yaw.  This is command-relative: it does
# not bind the robot to a world axis, stair axis, or terrain label.
# Fixed small weight; stronger values can suppress necessary stair body motion.
weight = -0.095
[rewards.uncommanded_heading_drift.params]
command_name = "base_velocity"
min_command_speed = 0.10
yaw_cmd_threshold = 0.08
deadzone_deg = 3.0
max_error_deg = 35.0
log_interval = 100

[rewards.feet_clearance]
# Dense terrain-aware swing-foot clearance reward.  This is the primary stair
# acquisition signal, borrowed from the WK/HJC-style stair configs but started
# at a lower weight to avoid over-lifting and energy waste.
# Fixed non-zero weight so the term is registered and contributes from startup.
weight = 0.40
[rewards.feet_clearance.params]
command_name = "base_velocity"
target_height = 0.085
std = 0.075
terrain_height_scale = 0.80
max_terrain_extra_height = 0.12
speed_height_scale = 0.01
body_y_start = 5
body_y_end = 11
near_x_start = 2
near_x_end = 10
delta_quantile = 0.85
reward_scale = 1.20
max_reward = 1.00

[rewards.height_scan_feet_clearance]
# Scan-gated auxiliary stair lift reward.  Dense feet_clearance is the primary
# lift signal; this term only adds extra stair-specific shaping.
# Fixed small auxiliary weight; the height-scan gate limits it to stair-like areas.
weight = 0.28
[rewards.height_scan_feet_clearance.params]
command_name = "base_velocity"
base_target_height = 0.08
base_clearance = 0.055
min_clearance = 0.02
max_clearance = 0.14
step_height_scale = 0.75
max_extra_height = 0.12
speed_height_scale = 0.01
std = 0.065
max_air_time = 0.60
min_command_speed = 0.10
body_y_start = 5
body_y_end = 11
near_x_start = 0
near_x_end = 4
front_x_start = 4
front_x_end = 10
up_min_height = 0.025
up_max_height = 0.20
wall_min_height = 0.24
min_step_score = 0.02
max_wall_score = 0.08
reward_scale = 200.0
max_reward = 1.00
log_interval = 50

[rewards.stair_forward_foot_placement]
# Sparse touchdown reward for placing the foot forward onto an up-step surface.
# Kept weaker than clearance because first-contact signals are noisier.
# Fixed tiny touchdown weight; keep low because first-contact timing is noisy.
weight = 0.30
[rewards.stair_forward_foot_placement.params]
command_name = "base_velocity"
target_forward = 0.12
max_forward = 0.30
forward_std = 0.12
overshoot_std = 0.12
height_std = 0.09
touchdown_speed_std = 0.50
foot_ground_offset = 0.02
min_air_time = 0.03
min_command_speed = 0.10
body_y_start = 5
body_y_end = 11
near_x_start = 0
near_x_end = 4
front_x_start = 4
front_x_end = 10
up_min_height = 0.025
up_max_height = 0.20
wall_min_height = 0.24
min_step_score = 0.02
max_wall_score = 0.08
reward_scale = 500.0
max_reward = 1.00
log_interval = 50

[rewards.stair_over_clearance_penalty]
# Penalize sustained swing-foot height far above the scan-estimated upper stair
# surface.  Fixed non-zero registration; do not schedule from zero.
weight = -0.12
[rewards.stair_over_clearance_penalty.params]
max_clearance = 0.16
std = 0.06
min_air_time = 0.08
body_y_start = 5
body_y_end = 11
near_x_start = 0
near_x_end = 4
front_x_start = 4
front_x_end = 10
up_min_height = 0.025
up_max_height = 0.20
wall_min_height = 0.24
min_step_score = 0.02
max_wall_score = 0.08
max_penalty = 1.5
log_interval = 50

[rewards.stair_base_clearance_penalty]
# Penalize the "body too low on up-step" failure mode only when the height
# scanner sees an upward stair edge.  This is not a global base-height prior.
weight = -0.08
[rewards.stair_base_clearance_penalty.params]
command_name = "base_velocity"
min_command_speed = 0.10
min_clearance = 0.34
std = 0.08
max_penalty = 1.5
body_y_start = 5
body_y_end = 11
near_x_start = 0
near_x_end = 4
front_x_start = 4
front_x_end = 10
up_min_height = 0.025
up_max_height = 0.20
wall_min_height = 0.24
min_step_score = 0.02
max_wall_score = 0.08
log_interval = 50

[rewards.stair_edge_normal_alignment]
# Penalize moving along a detected stair edge.  The edge normal is estimated
# from the robot-aligned 16x16 height scan and compared with the mixed command
# direction, so this does not bind the policy to a fixed world axis.
weight = -0.035
[rewards.stair_edge_normal_alignment.params]
command_name = "base_velocity"
min_command_speed = 0.10
min_edge_strength = 0.04
max_penalty = 1.0
body_y_start = 5
body_y_end = 11
near_x_start = 0
near_x_end = 4
front_x_start = 4
front_x_end = 10
up_min_height = 0.025
up_max_height = 0.20
wall_min_height = 0.24
min_step_score = 0.02
max_wall_score = 0.08
log_interval = 50

[rewards.down_stair_speed_safety]
# Penalize down-step rushing and unstable base motion.  The allowed forward
# speed follows the command: max(0.35, 0.65 * command_speed).
weight = -0.10
[rewards.down_stair_speed_safety.params]
command_name = "base_velocity"
min_command_speed = 0.10
min_allowed_speed = 0.35
command_speed_ratio = 0.65
speed_std = 0.25
max_vertical_speed = 0.35
vertical_std = 0.25
max_ang_vel_xy = 0.75
ang_std = 0.45
vertical_weight = 1.0
angular_weight = 1.0
max_penalty = 2.0
body_y_start = 5
body_y_end = 11
near_x_start = 0
near_x_end = 4
front_x_start = 4
front_x_end = 10
up_min_height = 0.025
up_max_height = 0.20
wall_min_height = 0.24
min_step_score = 0.02
max_wall_score = 0.08
log_interval = 50

[rewards.down_stair_touchdown_safety]
# Penalize hard first contacts while descending a detected down-step.
weight = -0.16
[rewards.down_stair_touchdown_safety.params]
max_foot_down_vel = 0.28
foot_vel_std = 0.18
