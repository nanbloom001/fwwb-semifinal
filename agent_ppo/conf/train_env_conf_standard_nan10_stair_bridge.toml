# =============================================================================
# Velocity Curriculum Configuration
# 速度课程配置
#
# Managed by VelocityCurriculum in train_workflow.py, completely independent
# of terrain.curriculum. Expands command sampling ranges stage by stage
# based on mean reward_track_lin_vel_xy performance.
# 由 train_workflow.py 中 VelocityCurriculum 类管理，独立于地形课程。
# 根据 reward_track_lin_vel_xy 均值，逐阶扩大速度指令采样范围。
# =============================================================================
[velocity_curriculum]
# Thresholds now use tracking ratio in [0,1] instead of absolute weighted reward.
# This prevents curriculum behavior from drifting when reward weight changes.
# 现改为 tracking 比例阈值（[0,1]），避免 reward weight 一改，课程门槛就漂移。
# Continuation from the 10650 checkpoint: stages are intentionally accelerated
# so the schedule reaches its final state in about 15 minutes.
# 从 10650 继续：课程有意加速，使调度约 15 分钟进入最终状态。
promote_threshold = 0.55
promote_count = 3
min_checks_per_stage = 20
min_seconds_per_stage = 300.0

# Demote when normalized tracking falls below 30% for consecutive checks.
# tracking 比例连续低于 30% 时降级。
demote_threshold = 0.30
demote_count = 3

# Velocity stages: 4 progressive levels.
# Stage 0 must match commands.ranges above (applied at startup, no env.reset needed).
# 4 个渐进速度阶段；Stage 0 必须与上方 commands.ranges 完全一致（启动时直接生效）
